# IncidentLens AI — dev CI/CD
#
# Architecture: GitHub Actions → OIDC → AWS IAM role → Terraform (S3 state) → AWS
# Runbooks:
#   - docs/runbooks/github-actions-deployment.md
#   - docs/runbooks/terraform-remote-state.md
#
# Supply-chain note: actions are pinned to stable major versions. Prefer full
# commit SHA pins as a future hardening step once the workflow is proven.

name: Deploy Dev

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: incidentlens-dev-deployment
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: '22'
  TF_WORKING_DIR: infrastructure/terraform/environments/dev
  # hashicorp/setup-terraform — keep aligned with local/bootstrap (>= 1.10 for use_lockfile)
  TERRAFORM_VERSION: '1.14.4'

jobs:
  ci:
    name: Application checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit / integration tests
        run: npm test

      - name: Coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Build Lambda package
        run: npm run build:lambda

      - name: Verify Lambda package
        run: |
          test -d dist/lambda
          test -f dist/lambda/apps/demo-api/src/lambda.js
          test -f dist/lambda/package.json

      - name: Upload Lambda package
        uses: actions/upload-artifact@v4
        with:
          name: lambda-package
          path: dist/lambda
          retention-days: 7
          if-no-files-found: error

      - name: Lambda package size
        id: lambda_size
        run: |
          SIZE=$(du -sh dist/lambda | awk '{print $1}')
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "Lambda package size: $SIZE" >> "$GITHUB_STEP_SUMMARY"

  terraform-pr:
    name: Terraform validate (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: ci
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive
        working-directory: infrastructure/terraform

      - name: Terraform init (no backend)
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Job summary
        run: |
          {
            echo "## Deploy Dev — PR validation"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Event | \`${{ github.event_name }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Environment | dev |"
            echo "| Application checks | passed |"
            echo "| Terraform | fmt + validate (no AWS OIDC / no remote plan) |"
            echo "| Apply | not applied |"
            echo ""
            echo "AWS-backed \`terraform plan\` runs only on \`main\` because OIDC trust is limited to \`refs/heads/main\`. See [github-actions-deployment.md](../blob/main/docs/runbooks/github-actions-deployment.md)."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Terraform plan / apply (main)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: ci
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      ENABLE_TERRAFORM_APPLY: ${{ vars.ENABLE_TERRAFORM_APPLY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Lambda package
        uses: actions/download-artifact@v4
        with:
          name: lambda-package
          path: dist/lambda

      - name: Verify Lambda package for Terraform
        working-directory: ${{ github.workspace }}
        run: |
          test -d dist/lambda
          SIZE=$(du -sh dist/lambda | awk '{print $1}')
          echo "LAMBDA_PACKAGE_SIZE=$SIZE" >> "$GITHUB_ENV"
          echo "Lambda package ready ($SIZE)"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive
        working-directory: infrastructure/terraform

      - name: Write backend.hcl
        working-directory: ${{ github.workspace }}/${{ env.TF_WORKING_DIR }}
        run: |
          cat > backend.hcl <<EOF
          bucket = "${TF_STATE_BUCKET}"
          region = "${AWS_REGION}"
          EOF

      - name: Terraform init (remote state)
        run: |
          terraform init \
            -input=false \
            -backend-config=backend.hcl \
            -lockfile=readonly

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        id: plan
        run: |
          set -euo pipefail
          terraform plan \
            -input=false \
            -no-color \
            -out=tfplan \
            | tee tfplan.txt
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Upload plan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-dev
          path: |
            ${{ env.TF_WORKING_DIR }}/tfplan
            ${{ env.TF_WORKING_DIR }}/tfplan.txt
          retention-days: 7
          if-no-files-found: error

      - name: Upload Lambda package (audit copy)
        uses: actions/upload-artifact@v4
        with:
          name: lambda-package-planned
          path: dist/lambda
          retention-days: 7

      - name: Decide apply
        id: decide
        working-directory: ${{ github.workspace }}
        run: |
          APPLY="false"
          REASON="not applied"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            REASON="workflow_dispatch is plan-only"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            if [[ "${ENABLE_TERRAFORM_APPLY}" == "true" ]]; then
              APPLY="true"
              REASON="push to main with ENABLE_TERRAFORM_APPLY=true"
            else
              REASON="ENABLE_TERRAFORM_APPLY is not true (safety gate)"
            fi
          else
            REASON="event/branch not eligible for apply"
          fi
          echo "apply=$APPLY" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "Apply decision: $APPLY ($REASON)"

      - name: Terraform apply (saved plan)
        id: apply
        if: steps.decide.outputs.apply == 'true'
        run: |
          terraform apply -input=false -auto-approve tfplan
          echo "status=applied" >> "$GITHUB_OUTPUT"

      - name: Read API invoke URL
        id: outputs
        if: steps.decide.outputs.apply == 'true'
        run: |
          URL=$(terraform output -raw api_invoke_url)
          echo "api_invoke_url=$URL" >> "$GITHUB_OUTPUT"
          echo "API invoke URL: $URL"

      - name: Smoke tests (read-only)
        id: smoke
        if: steps.decide.outputs.apply == 'true'
        working-directory: ${{ github.workspace }}
        env:
          API_BASE: ${{ steps.outputs.outputs.api_invoke_url }}
        run: |
          set -euo pipefail
          BASE="${API_BASE%/}"
          attempt=0
          max_attempts=8
          until curl -fsS --max-time 15 --retry 0 "${BASE}/health" >/tmp/health.json; do
            attempt=$((attempt + 1))
            if [[ "$attempt" -ge "$max_attempts" ]]; then
              echo "GET /health failed after ${max_attempts} attempts"
              exit 1
            fi
            echo "Waiting for API propagation (attempt ${attempt}/${max_attempts})..."
            sleep 5
          done
          echo "GET /health OK"
          cat /tmp/health.json
          echo ""

          curl -fsS --max-time 15 --retry 3 --retry-delay 2 \
            -H "Accept: application/json" \
            "${BASE}/incidents" >/tmp/incidents.json
          python3 - <<'PY'
          import json, sys
          with open("/tmp/incidents.json") as f:
              data = json.load(f)
          print("GET /incidents OK; JSON type:", type(data).__name__)
          PY
          echo "status=passed" >> "$GITHUB_OUTPUT"

      - name: Job summary
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          PLAN_STATUS: ${{ steps.plan.outcome || 'skipped' }}
          APPLY_RAN: ${{ steps.decide.outputs.apply || 'false' }}
          APPLY_REASON: ${{ steps.decide.outputs.reason || 'n/a' }}
          APPLY_OUTCOME: ${{ steps.apply.outcome || 'skipped' }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome || 'skipped' }}
          API_URL: ${{ steps.outputs.outputs.api_invoke_url || 'n/a' }}
        run: |
          APPLY_STATUS="not applied (${APPLY_REASON})"
          if [[ "$APPLY_RAN" == "true" ]]; then
            APPLY_STATUS="$APPLY_OUTCOME"
          fi
          {
            echo "## Deploy Dev — summary"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Event | \`${{ github.event_name }}\` |"
            echo "| Ref | \`${{ github.ref }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Environment | dev |"
            echo "| Application checks | passed (job \`ci\`) |"
            echo "| Terraform plan | ${PLAN_STATUS} |"
            echo "| Apply | ${APPLY_STATUS} |"
            echo "| Lambda package size | ${LAMBDA_PACKAGE_SIZE:-unknown} |"
            echo "| API endpoint | ${API_URL} |"
            echo "| Smoke tests | ${SMOKE_OUTCOME} |"
            echo ""
            echo "Runbooks: [GitHub Actions deployment](../blob/main/docs/runbooks/github-actions-deployment.md) · [Remote state](../blob/main/docs/runbooks/terraform-remote-state.md)"
          } >> "$GITHUB_STEP_SUMMARY"
