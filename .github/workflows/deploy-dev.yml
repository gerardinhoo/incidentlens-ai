# IncidentLens AI — dev CI/CD
#
# Architecture: GitHub Actions → OIDC → AWS IAM role → Terraform (S3 state) → AWS
# Runbooks:
#   - docs/runbooks/github-actions-deployment.md
#   - docs/runbooks/terraform-remote-state.md
#   - docs/runbooks/deployment-testing.md
#
# Supply-chain note: actions are pinned to stable major versions. Prefer full
# commit SHA pins as a future hardening step once the workflow is proven.

name: Deploy Dev

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pipeline_test_only:
        description: >-
          Skip Terraform plan/apply; run live Sprint 4/5 verification against
          the existing dev stack (requires OIDC + remote state).
        type: boolean
        default: false

# Prevent overlapping deploys/tests (colliding incidents, log polls, emails, TF).
concurrency:
  group: incidentlens-dev-deployment
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: '22'
  TF_WORKING_DIR: infrastructure/terraform/environments/dev
  # hashicorp/setup-terraform — keep aligned with local/bootstrap (>= 1.10 for use_lockfile)
  TERRAFORM_VERSION: '1.14.4'

jobs:
  ci:
    name: Application checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm --prefix apps/web ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend typecheck
        run: npm run typecheck:web

      - name: Unit / integration tests
        run: npm test

      - name: Frontend tests
        run: npm run test:web

      - name: Local processor pipeline integration
        run: npm run test:pipeline-local

      - name: Shell syntax check (pipeline scripts)
        run: |
          bash -n scripts/verify-incident-pipeline.sh
          bash -n scripts/verify-aws-deployment.sh
          bash -n scripts/verify-automatic-incident-creation.sh
          bash -n scripts/verify-idempotent-processing.sh
          bash -n scripts/verify-log-subscription-delivery.sh
          bash -n scripts/verify-ai-incident-enrichment.sh
          bash -n scripts/verify-incident-notification.sh
          bash -n scripts/verify-ai-incident-pipeline.sh
          bash -n scripts/smoke-sns-notification.sh

      - name: Sprint 5 local AI pipeline integration
        run: npm run test:sprint5-local

      - name: Coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Frontend build
        run: npm run build:web

      - name: Build Lambda packages (API + processor)
        run: npm run build:lambda

      - name: Validate Lambda packages
        id: lambda_validate
        run: ./scripts/validate-lambda-package.sh

      - name: Upload Lambda packages
        uses: actions/upload-artifact@v4
        with:
          name: lambda-package
          path: dist/lambda
          retention-days: 7
          if-no-files-found: error

      - name: Lambda package sizes
        id: lambda_size
        run: |
          API_SIZE=$(du -sh dist/lambda/api | awk '{print $1}')
          PROC_SIZE=$(du -sh dist/lambda/processor | awk '{print $1}')
          TOTAL_SIZE=$(du -sh dist/lambda | awk '{print $1}')
          echo "api_size=$API_SIZE" >> "$GITHUB_OUTPUT"
          echo "processor_size=$PROC_SIZE" >> "$GITHUB_OUTPUT"
          echo "size=$TOTAL_SIZE" >> "$GITHUB_OUTPUT"
          {
            echo "### Lambda package sizes"
            echo ""
            echo "| Package | Size |"
            echo "| --- | --- |"
            echo "| API (\`dist/lambda/api\`) | ${API_SIZE} |"
            echo "| Processor (\`dist/lambda/processor\`) | ${PROC_SIZE} |"
            echo "| Combined artifact | ${TOTAL_SIZE} |"
          } >> "$GITHUB_STEP_SUMMARY"

  terraform-pr:
    name: Terraform checks (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: ci
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive
        working-directory: infrastructure/terraform

      - name: Terraform init (no backend)
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform native tests (mocked; no AWS)
        id: tftest
        working-directory: ${{ github.workspace }}
        run: ./scripts/test-terraform.sh

      - name: Job summary
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          TFTEST: ${{ steps.tftest.outcome || 'skipped' }}
        run: |
          {
            echo "## Deploy Dev — PR validation"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Event | \`${{ github.event_name }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Environment | dev |"
            echo "| Application checks | passed |"
            echo "| Lambda package validation (API + processor) | passed |"
            echo "| Terraform fmt/validate | passed |"
            echo "| Terraform native tests | ${TFTEST} |"
            echo "| AWS-backed terraform plan | not run on PR (OIDC trusts main only) |"
            echo "| Local pipeline integration (\`test:pipeline-local\`) | passed (job \`ci\`) |"
            echo "| Deployed AWS /live pipeline / DynamoDB writes | **not run on PR** |"
            echo "| Apply | not applied |"
            echo ""
            echo "See [pipeline-integration-testing.md](../blob/main/docs/runbooks/pipeline-integration-testing.md)."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Terraform plan / apply (main)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: ci
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      ENABLE_TERRAFORM_APPLY: ${{ vars.ENABLE_TERRAFORM_APPLY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Lambda package
        uses: actions/download-artifact@v4
        with:
          name: lambda-package
          path: dist/lambda

      - name: Validate Lambda packages
        id: lambda_validate
        working-directory: ${{ github.workspace }}
        run: |
          ./scripts/validate-lambda-package.sh
          API_SIZE=$(du -sh dist/lambda/api | awk '{print $1}')
          PROC_SIZE=$(du -sh dist/lambda/processor | awk '{print $1}')
          TOTAL_SIZE=$(du -sh dist/lambda | awk '{print $1}')
          echo "LAMBDA_PACKAGE_SIZE=$TOTAL_SIZE" >> "$GITHUB_ENV"
          echo "API_LAMBDA_PACKAGE_SIZE=$API_SIZE" >> "$GITHUB_ENV"
          echo "PROCESSOR_LAMBDA_PACKAGE_SIZE=$PROC_SIZE" >> "$GITHUB_ENV"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive
        working-directory: infrastructure/terraform

      - name: Terraform native tests (mocked; no AWS)
        id: tftest
        working-directory: ${{ github.workspace }}
        run: ./scripts/test-terraform.sh

      - name: Write backend.hcl
        working-directory: ${{ github.workspace }}/${{ env.TF_WORKING_DIR }}
        run: |
          cat > backend.hcl <<EOF
          bucket = "${TF_STATE_BUCKET}"
          region = "${AWS_REGION}"
          EOF

      - name: Terraform init (remote state)
        run: |
          terraform init \
            -input=false \
            -backend-config=backend.hcl \
            -lockfile=readonly

      - name: Terraform validate
        run: terraform validate

      - name: Decide apply / pipeline-only
        id: decide
        working-directory: ${{ github.workspace }}
        run: |
          APPLY="false"
          REASON="not applied"
          PIPELINE_ONLY="false"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.pipeline_test_only }}" == "true" ]]; then
              PIPELINE_ONLY="true"
              REASON="workflow_dispatch pipeline_test_only (no plan/apply)"
            else
              REASON="workflow_dispatch is plan-only"
            fi
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            if [[ "${ENABLE_TERRAFORM_APPLY}" == "true" ]]; then
              APPLY="true"
              REASON="push to main with ENABLE_TERRAFORM_APPLY=true"
            else
              REASON="ENABLE_TERRAFORM_APPLY is not true (safety gate)"
            fi
          else
            REASON="event/branch not eligible for apply"
          fi
          echo "apply=$APPLY" >> "$GITHUB_OUTPUT"
          echo "pipeline_only=$PIPELINE_ONLY" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "Apply decision: $APPLY pipeline_only=$PIPELINE_ONLY ($REASON)"

      - name: Terraform plan
        id: plan
        if: steps.decide.outputs.pipeline_only != 'true'
        run: |
          set -euo pipefail
          terraform plan \
            -input=false \
            -no-color \
            -out=tfplan \
            | tee tfplan.txt
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Upload plan artifacts
        if: steps.decide.outputs.pipeline_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-dev
          path: |
            ${{ env.TF_WORKING_DIR }}/tfplan
            ${{ env.TF_WORKING_DIR }}/tfplan.txt
          retention-days: 7
          if-no-files-found: error

      - name: Upload Lambda package (audit copy)
        if: steps.decide.outputs.pipeline_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lambda-package-planned
          path: dist/lambda
          retention-days: 7

      - name: Terraform apply (saved plan)
        id: apply
        if: steps.decide.outputs.apply == 'true'
        run: |
          terraform apply -input=false -auto-approve tfplan
          echo "status=applied" >> "$GITHUB_OUTPUT"

      - name: Read deployment outputs
        id: outputs
        if: steps.decide.outputs.apply == 'true' || steps.decide.outputs.pipeline_only == 'true'
        run: |
          URL=$(terraform output -raw api_invoke_url)
          echo "api_invoke_url=$URL" >> "$GITHUB_OUTPUT"
          echo "lambda_function_name=$(terraform output -raw lambda_function_name)" >> "$GITHUB_OUTPUT"
          echo "processor_lambda_function_name=$(terraform output -raw processor_lambda_function_name)" >> "$GITHUB_OUTPUT"
          echo "incidents_table_name=$(terraform output -raw incidents_table_name)" >> "$GITHUB_OUTPUT"
          echo "api_id=$(terraform output -raw api_id)" >> "$GITHUB_OUTPUT"
          echo "lambda_log_group_name=$(terraform output -raw lambda_log_group_name)" >> "$GITHUB_OUTPUT"
          echo "processor_log_group_name=$(terraform output -raw processor_log_group_name)" >> "$GITHUB_OUTPUT"
          echo "api_access_log_group_name=$(terraform output -raw api_access_log_group_name)" >> "$GITHUB_OUTPUT"
          echo "sns_incident_topic_arn=$(terraform output -raw sns_incident_topic_arn 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
          echo "API invoke URL: $URL"

      - name: Verify AWS deployment (read-only)
        id: aws_verify
        if: steps.decide.outputs.apply == 'true' || steps.decide.outputs.pipeline_only == 'true'
        working-directory: ${{ github.workspace }}
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          LAMBDA_FUNCTION_NAME: ${{ steps.outputs.outputs.lambda_function_name }}
          PROCESSOR_FUNCTION_NAME: ${{ steps.outputs.outputs.processor_lambda_function_name }}
          API_ID: ${{ steps.outputs.outputs.api_id }}
          DYNAMODB_TABLE_NAME: ${{ steps.outputs.outputs.incidents_table_name }}
          LAMBDA_LOG_GROUP: ${{ steps.outputs.outputs.lambda_log_group_name }}
          PROCESSOR_LOG_GROUP: ${{ steps.outputs.outputs.processor_log_group_name }}
          ACCESS_LOG_GROUP: ${{ steps.outputs.outputs.api_access_log_group_name }}
          VERIFY_OUT_DIR: ${{ github.workspace }}/artifacts/deployment-tests
        run: |
          # Brief bounded wait for API + processor Lambdas Active / Successful after apply
          for fn in "${LAMBDA_FUNCTION_NAME}" "${PROCESSOR_FUNCTION_NAME}"; do
            for i in 1 2 3 4 5 6; do
              STATE=$(aws lambda get-function-configuration \
                --function-name "${fn}" \
                --query 'LastUpdateStatus' --output text 2>/dev/null || echo Pending)
              if [[ "${STATE}" == "Successful" ]]; then
                break
              fi
              echo "Waiting for ${fn} update (${i}/6): ${STATE}"
              sleep 5
            done
          done
          ./scripts/verify-aws-deployment.sh

      - name: Processor direct invoke (safe fixture)
        id: processor_invoke
        if: steps.decide.outputs.apply == 'true' || steps.decide.outputs.pipeline_only == 'true'
        working-directory: ${{ github.workspace }}
        env:
          PROCESSOR_FUNCTION_NAME: ${{ steps.outputs.outputs.processor_lambda_function_name }}
          VERIFY_OUT_DIR: ${{ github.workspace }}/artifacts/deployment-tests
        run: |
          set -euo pipefail
          mkdir -p "${VERIFY_OUT_DIR}"
          OUT="${VERIFY_OUT_DIR}/processor-invoke-response.json"
          aws lambda invoke \
            --function-name "${PROCESSOR_FUNCTION_NAME}" \
            --cli-binary-format raw-in-base64-out \
            --payload fileb://tests/fixtures/processor/generic-event.json \
            "${OUT}"
          python3 - "${OUT}" <<'PY'
          import json, sys
          path = sys.argv[1]
          data = json.load(open(path))
          assert data.get("accepted") is True, data
          assert data.get("processedRecords") == 0, data
          assert data.get("messageType") == "unclassified", data
          assert data.get("receivedRecords") == 0, data
          json.dump(
              {
                  "accepted": data["accepted"],
                  "messageType": data.get("messageType"),
                  "receivedRecords": data.get("receivedRecords"),
                  "processedRecords": data["processedRecords"],
                  "ignoredRecords": data.get("ignoredRecords"),
                  "failedRecords": data.get("failedRecords"),
                  "attemptedIncidents": data.get("attemptedIncidents"),
                  "persistedIncidents": data.get("persistedIncidents"),
                  "duplicateIncidents": data.get("duplicateIncidents"),
                  "persistenceFailures": data.get("persistenceFailures"),
              },
              open(path, "w"),
              indent=2,
          )
          assert data.get("attemptedIncidents", 0) == 0, data
          assert data.get("persistedIncidents", 0) == 0, data
          assert data.get("duplicateIncidents", 0) == 0, data
          assert data.get("persistenceFailures", 0) == 0, data
          print("processor invoke ok:", data)
          PY

      - name: Smoke tests (deployed)
        id: smoke
        if: steps.decide.outputs.apply == 'true' || steps.decide.outputs.pipeline_only == 'true'
        working-directory: ${{ github.workspace }}
        env:
          API_URL: ${{ steps.outputs.outputs.api_invoke_url }}
          SMOKE_OUT_DIR: ${{ github.workspace }}/artifacts/deployment-tests
        run: ./scripts/smoke-test-deployment.sh

      # One controlled /test-error + DynamoDB assert + deterministic idempotency replay.
      # Replaces separate subscription-only smoke for post-apply write proof (SCRUM-36).
      - name: Sprint 4 pipeline integration
        id: pipeline_integration
        if: steps.decide.outputs.apply == 'true' || steps.decide.outputs.pipeline_only == 'true'
        working-directory: ${{ github.workspace }}
        env:
          API_URL: ${{ steps.outputs.outputs.api_invoke_url }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          INCIDENTS_TABLE_NAME: ${{ steps.outputs.outputs.incidents_table_name }}
          PROCESSOR_FUNCTION_NAME: ${{ steps.outputs.outputs.processor_lambda_function_name }}
          PROCESSOR_LOG_GROUP_NAME: ${{ steps.outputs.outputs.processor_log_group_name }}
          API_LOG_GROUP_NAME: ${{ steps.outputs.outputs.lambda_log_group_name }}
          LAMBDA_FUNCTION_NAME: ${{ steps.outputs.outputs.lambda_function_name }}
          ACCESS_LOG_GROUP: ${{ steps.outputs.outputs.api_access_log_group_name }}
          PIPELINE_OUT_DIR: ${{ github.workspace }}/artifacts/pipeline-integration
          PIPELINE_TIMEOUT_SEC: '120'
          PIPELINE_POLL_SEC: '5'
          RUN_CONFIG_VERIFY: 'false'
          GITHUB_SHA: ${{ github.sha }}
        run: ./scripts/verify-incident-pipeline.sh

      # Sprint 5 consolidated AI pipeline (one /test-error + Lambda duplicate replay).
      # Composes config verify + enrichment + SNS counters. No inbox automation.
      # Disable with repository variable ENABLE_SPRINT5_AI_PIPELINE_VERIFY=false.
      # Standalone scripts remain: verify-ai-incident-enrichment.sh,
      # verify-incident-notification.sh (manual / optional).
      - name: Sprint 5 AI incident pipeline verification
        id: sprint5_ai_pipeline
        if: >
          (steps.decide.outputs.apply == 'true' || steps.decide.outputs.pipeline_only == 'true') &&
          vars.ENABLE_SPRINT5_AI_PIPELINE_VERIFY != 'false'
        working-directory: ${{ github.workspace }}
        env:
          API_URL: ${{ steps.outputs.outputs.api_invoke_url }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          INCIDENTS_TABLE_NAME: ${{ steps.outputs.outputs.incidents_table_name }}
          PROCESSOR_FUNCTION_NAME: ${{ steps.outputs.outputs.processor_lambda_function_name }}
          PROCESSOR_LOG_GROUP_NAME: ${{ steps.outputs.outputs.processor_log_group_name }}
          SNS_INCIDENT_TOPIC_ARN: ${{ steps.outputs.outputs.sns_incident_topic_arn }}
          VERIFY_OUT_DIR: ${{ github.workspace }}/artifacts/deployment-tests/sprint5-ai-pipeline
          PIPELINE_TIMEOUT_SEC: '210'
          PIPELINE_POLL_SEC: '5'
          # aws_verify already ran; avoid duplicate config scan noise.
          RUN_CONFIG_VERIFY: 'false'
          GITHUB_SHA: ${{ github.sha }}
        run: ./scripts/verify-ai-incident-pipeline.sh

      - name: Upload deployment-test artifacts
        if: always() && (steps.decide.outputs.apply == 'true' || steps.decide.outputs.pipeline_only == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: deployment-tests-dev-${{ github.sha }}
          path: artifacts/deployment-tests/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload pipeline-integration artifacts
        if: always() && (steps.decide.outputs.apply == 'true' || steps.decide.outputs.pipeline_only == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-integration-dev-${{ github.sha }}
          path: artifacts/pipeline-integration/
          retention-days: 7
          if-no-files-found: ignore

      - name: Job summary
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          PLAN_STATUS: ${{ steps.plan.outcome || 'skipped' }}
          TFTEST: ${{ steps.tftest.outcome || 'skipped' }}
          LAMBDA_VALIDATE: ${{ steps.lambda_validate.outcome || 'skipped' }}
          APPLY_RAN: ${{ steps.decide.outputs.apply || 'false' }}
          PIPELINE_ONLY: ${{ steps.decide.outputs.pipeline_only || 'false' }}
          APPLY_REASON: ${{ steps.decide.outputs.reason || 'n/a' }}
          APPLY_OUTCOME: ${{ steps.apply.outcome || 'skipped' }}
          AWS_VERIFY: ${{ steps.aws_verify.outcome || 'skipped' }}
          PROCESSOR_INVOKE: ${{ steps.processor_invoke.outcome || 'skipped' }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome || 'skipped' }}
          PIPELINE: ${{ steps.pipeline_integration.outcome || 'skipped' }}
          SPRINT5: ${{ steps.sprint5_ai_pipeline.outcome || 'skipped' }}
          API_URL: ${{ steps.outputs.outputs.api_invoke_url || 'n/a' }}
        run: |
          APPLY_STATUS="not applied (${APPLY_REASON})"
          if [[ "$APPLY_RAN" == "true" ]]; then
            APPLY_STATUS="$APPLY_OUTCOME"
          fi
          OVERALL="PASS"
          if [[ "${PLAN_STATUS}" == "failure" || "${TFTEST}" == "failure" || "${LAMBDA_VALIDATE}" == "failure" || "${APPLY_OUTCOME}" == "failure" || "${AWS_VERIFY}" == "failure" || "${PROCESSOR_INVOKE}" == "failure" || "${SMOKE_OUTCOME}" == "failure" || "${PIPELINE}" == "failure" || "${SPRINT5}" == "failure" ]]; then
            OVERALL="FAIL"
          fi
          status_label() { [[ "$1" == "success" ]] && echo "pass" || echo "$1"; }
          {
            echo "## Deploy Dev — summary"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Event | \`${{ github.event_name }}\` |"
            echo "| Ref | \`${{ github.ref }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Environment | dev |"
            echo "| Overall | **${OVERALL}** |"
            echo "| Application checks | passed (job \`ci\`) |"
            echo "| Lambda artifact validation | ${LAMBDA_VALIDATE} |"
            echo "| Terraform native tests | ${TFTEST} |"
            echo "| Terraform plan | ${PLAN_STATUS} |"
            echo "| Apply | ${APPLY_STATUS} |"
            echo "| Pipeline-only mode | ${PIPELINE_ONLY} |"
            echo "| AWS configuration verify | ${AWS_VERIFY} |"
            echo "| Processor direct invoke | ${PROCESSOR_INVOKE} |"
            echo "| Smoke tests | ${SMOKE_OUTCOME} |"
            echo "| Sprint 4 pipeline integration | ${PIPELINE} |"
            echo "| Sprint 5 AI pipeline | ${SPRINT5} |"
            echo "| API endpoint | ${API_URL} |"
            echo "| Evidence artifact | \`deployment-tests-dev-${{ github.sha }}\` |"
            echo ""
            echo "## IncidentLens Sprint 5 Verification"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| API deployment | $(status_label "${SMOKE_OUTCOME}") |"
            echo "| CloudWatch delivery | $(status_label "${PIPELINE}") |"
            echo "| Incident persistence | $(status_label "${PIPELINE}") |"
            echo "| AI analysis | $(status_label "${SPRINT5}") |"
            echo "| Idempotency replay | $(status_label "${SPRINT5}") |"
            echo "| SNS publish | $(status_label "${SPRINT5}") |"
            echo "| Evidence artifact | \`deployment-tests-dev-${{ github.sha }}\` |"
            echo "| Overall | **${OVERALL}** |"
            echo ""
            if [[ -f artifacts/deployment-tests/sprint5-ai-pipeline/sprint5-summary.md ]]; then
              cat artifacts/deployment-tests/sprint5-ai-pipeline/sprint5-summary.md
              echo ""
            fi
            if [[ -f artifacts/pipeline-integration/pipeline-summary.md ]]; then
              echo "### Sprint 4 pipeline details"
              echo ""
              cat artifacts/pipeline-integration/pipeline-summary.md
              echo ""
            fi
            if [[ -f artifacts/deployment-tests/smoke-test-summary.md ]]; then
              echo "### Smoke test details"
              echo ""
              cat artifacts/deployment-tests/smoke-test-summary.md
              echo ""
            fi
            if [[ -f artifacts/deployment-tests/sprint5-ai-pipeline/aws-verify-summary.md ]]; then
              echo "### AWS verification details"
              echo ""
              cat artifacts/deployment-tests/sprint5-ai-pipeline/aws-verify-summary.md
              echo ""
            elif [[ -f artifacts/deployment-tests/aws-verify-summary.md ]]; then
              echo "### AWS verification details"
              echo ""
              cat artifacts/deployment-tests/aws-verify-summary.md
              echo ""
            fi
            echo "Runbooks: [Sprint 5 E2E](../blob/main/docs/runbooks/sprint5-end-to-end-verification.md) · [Pipeline integration](../blob/main/docs/runbooks/pipeline-integration-testing.md)"
          } >> "$GITHUB_STEP_SUMMARY"
